[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pav"
version = "1.4.4"
description = "PAV is a Python library with features to easily work with venv"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Groot"}
]
requires-python = ">=3.8"
dependencies = ["click>=8.1,<9", "requests>=2.30,<3"]

[project.urls]
Homepage = "https://github.com/grootle/PAV"
Repository = "https://github.com/grootle/PAV"
Issues = "https://github.com/grootle/PAV/issues"

[project.scripts]
pav = "pav.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"pav" = ["mapping"]
